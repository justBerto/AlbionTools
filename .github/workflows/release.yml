name: Release AlbionTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build & Bundle Sniffer Daemon Sidecar
        shell: pwsh
        run: |
          dotnet publish daemon/AlbionTools.Daemon.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o src-tauri/binaries
          Copy-Item -Path src-tauri/binaries/AlbionTools.Daemon.exe -Destination src-tauri/binaries/AlbionTools.Daemon-x86_64-pc-windows-msvc.exe -Force

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AlbionTools Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🛡️ AlbionTools: Companion & Telemetry Suite (${{ github.ref_name }})

            ### 🚀 What's New & Changelog

            #### ✨ New Features & Enhancements
            - **Complete Game Item Encyclopedia**: Rebuilt the item database directly from official Albion Online game dumps (`items.bin`), featuring 675 base item families across all 6 categories (Weapons, Armor, Materials, Accessories, Consumables, Mounts) with full T1 to T8 tiers and .0 to .4 enchantments.
            - **Dragonslayer Equipment & Crystal Weapons**: Full support for Dragonslayer Hood, Jacket, Shoes, Dragonhide artifacts, and all Crystal Weapons (including Crystal Reaper, Infinity Blade, Phantom Twinbow, etc.).
            - **Instant Search & Tier Name Matching**: High-performance search indexing matching item names, unique game IDs, subcategories, and localized tier names (e.g. searching "Dragonslayer", "Crystal Reaper", or "Pine Logs" instantly highlights the item).
            - **Player Weapon Icons in Damage Meter**: Equipped weapons are automatically detected from network packets and rendered as icons alongside player nicknames in the combat meter.
            - **Streamlined Floating HUD Controls**: Floating DPS/HPS overlay now features Save Snapshot, Reset, and Copy to Clipboard controls directly modeled after top statistics tools.
            - **Refined Session & Content Filters**: Unified session dropdowns ("Current Session" and "All Sessions") and streamlined content browsing across dungeons and open world.
            - **Real-Time Market Prices & Historical Trends**: Direct live integration with Albion Online Data Project (AODP) API v2 across Asia, Europe, and Americas servers with interactive price history charts and arbitrage calculators.
            - **High-Resolution Custom Branding**: Bundled bespoke application icons across all standard desktop resolutions (ICO, ICNS, PNG).
            - **Native Dark Mode Title Bar**: Configured Windows Immersive Dark Mode (`DWMWA_USE_IMMERSIVE_DARK_MODE` and `"theme": "Dark"`), giving the native OS window frame a sleek dark finish.

            #### 🐛 Bug Fixes & Refinements
            - **Looted Chests Active Content Fix**: Resolved an issue where multiple active contents (e.g. Solo Dungeon and Open World) were flagged simultaneously. Added clean state isolation and auto-reset.
            - **Header & Section Typography Polish**: Renamed "Looted Chests Matrix" to "Looted Chests" and removed confusing "(..)" and redundant "All content categories" dropdown clutter.
            - **Zero Memory Bloat**: Optimized 25 MB raw game dump down to an ultra-compact 271 KB structured catalog, guaranteeing 60 FPS UI performance and sub-millisecond search execution.
            - **Child Process Silence**: Enforced `CREATE_NO_WINDOW` on backend network bridges to eliminate flashing console windows during official API queries.
            - **Eliminated Duplicate HUD Overlay**: Removed redundant in-app overlay so clicking "Floating HUD" only triggers the dedicated OS overlay window.

            #### 🗑️ Removed
            - **Redundant Topbar Buttons**: Removed duplicate custom Pin, Minimize, Maximize, and Close buttons from the header (relying on Windows native titlebar controls).
            - **Dummy Mock Telemetry**: Purged mock preview data from Dashboard, Dungeons, Gathering, Guild, Storage, Map History, Loss Explorer, and Event Logger.

            ### 📦 Download Windows Installers:
            - **`.exe` (NSIS Installer)**: Standard setup wizard with desktop shortcut and language selection.
            - **`.msi` (Windows Installer)**: Enterprise/automated Windows installer package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
