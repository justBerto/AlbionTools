name: Release AlbionTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AlbionTools Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🛡️ AlbionTools — Companion & Telemetry Suite (${{ github.ref_name }})

            ### 🚀 Highlights & Changelog
            - **Modern Architecture**: Rebuilt with Tauri 2.0, React 19, TypeScript, and Tailwind CSS for blazing performance and ultra-low resource usage.
            - **Live Damage Meter & Floating Overlay**: Fully automated combat tracking (in-combat / out-of-combat detection) with an always-on-top draggable floating HUD overlay.
            - **Zero Dummy Data**: Clean live session telemetry across Dashboard, Dungeons, Gathering Stats, Guild, Storage, Map History, Loss Explorer, and Network Event Logger.
            - **Official GameInfo API Integration**: Inspect player lifetime stats (PvE, Gathering, Crafting) and killboard history via native bridge.
            - **Gathering & Activity Filters**: Filter harvest statistics by time range (Current Session, Today, Past 7 Days, All Time).
            - **Dungeon Analytics**: Comprehensive tracking for Solo, Corrupted, Hellgate, Mists, and Group Dungeons with a 90-second entrance safety timer.
            - **Persistent Configuration**: Saved server region (Asia / Europe / Americas) and client preferences automatically persist across app restarts.
            - **First-Start Setup Wizard**: Multilingual setup wizard defaulted to English with custom Albion installation path detection.

            ### 📦 Download Windows Installers:
            - **`.exe` (NSIS Installer)**: Standard setup wizard with desktop shortcut and language selection.
            - **`.msi` (Windows Installer)**: Enterprise/automated Windows installer package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
