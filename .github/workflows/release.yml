name: Release AlbionTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Generate Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AlbionTools Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🛡️ AlbionTools — Companion & Telemetry Suite (${{ github.ref_name }})

            ### 🚀 What's New & Changelog

            #### ✨ Added & Enhanced
            - **Native Dark Mode Title Bar**: Configured Windows Immersive Dark Mode (`DWMWA_USE_IMMERSIVE_DARK_MODE` and `"theme": "Dark"`), giving the native OS window frame a sleek black finish that matches the dark theme.
            - **Automated Combat Tracking**: DPS & HPS meters automatically detect combat activity with a 6-second dropoff timeout. Fight timer only ticks while actively in combat.
            - **True Floating Overlay HUD**: Launch a compact, always-on-top draggable floating DPS/HPS overlay window over Albion Online and other fullscreen borderless applications.
            - **Official API Player & Killboard Inspection**: Inspect player lifetime stats (PvE, Gathering, Crafting) and recent killboard events directly via native backend bridge without CORS errors.
            - **Activity Time Filters**: Added time-range filtering on Gathering stats (Current Session, Today, Past 7 Days, All Time).
            - **Bilingual Setup Wizard**: Setup wizard defaults to English with full support for dynamic switching to Bahasa Indonesia.
            - **Settings Persistence**: Configured server region (Asia / Europe / Americas) and client settings persist reliably across application sessions.

            #### 🐛 Bug Fixes
            - **Eliminated Duplicate HUD Overlay**: Fixed an issue where clicking "Floating HUD" opened both a desktop window and an in-app overlay. The in-app bottom-right overlay has been completely removed.
            - **Eliminated Blank White Screen on Reopen**: Resolved a zombie process lock issue where closing the main window kept background windows alive. Handled `CloseRequested` window event to terminate all processes cleanly on app exit.
            - **Eliminated Flashing CMD Popup**: Added Windows `CREATE_NO_WINDOW` flag (`0x08000000`) to native curl requests, completely silencing child processes during player lookups.

            #### 🗑️ Removed
            - **Redundant Topbar Buttons**: Removed duplicate custom Pin, Minimize, Maximize, and Close buttons from the header (relying on Windows native titlebar controls).
            - **In-App Secondary HUD**: Removed duplicate bottom-right in-app overlay.
            - **Dummy Mock Telemetry**: Purged mock preview data from Dashboard, Dungeons, Gathering, Guild, Storage, Map History, Loss Explorer, and Event Logger.

            ### 📦 Download Windows Installers:
            - **`.exe` (NSIS Installer)**: Standard setup wizard with desktop shortcut and language selection.
            - **`.msi` (Windows Installer)**: Enterprise/automated Windows installer package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
